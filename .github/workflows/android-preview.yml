name: Android preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-preview.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify APK
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o godot.zip
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_export_templates.tpz" -o templates.zip
          unzip -qo godot.zip
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable ~/.config/godot dist
          unzip -jo templates.zip 'templates/android_release.apk' -d ~/.local/share/godot/export_templates/4.6.3.stable
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.6.tres
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path game --export-release Android "$PWD/dist/unsigned.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          keytool -genkeypair -keystore "${RUNNER_TEMP}/preview.p12" -storepass androiddev -alias preview -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=No Mans Drive Preview'
          "$signer" sign --ks "${RUNNER_TEMP}/preview.p12" --ks-pass pass:androiddev --out dist/no-mans-drive-preview.apk dist/unsigned.apk
          "$signer" verify --verbose dist/no-mans-drive-preview.apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0-preview dist/no-mans-drive-preview.apk --target "$GITHUB_SHA" --title "No Man’s Drive Android Preview" --prerelease --notes "Playable prototype with RV driving, hunting, gathering, campfire cooking and modular building pieces. Full feature parity is in development."
