name: Android release
on:
  push:
    branches: [main, 'quality/**']
    paths: ['game/**', '.github/workflows/android-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Validate scripts and render quality tour
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o godot.zip
          unzip -qo godot.zip
          engine=./Godot_v4.6.3-stable_linux.x86_64
          mkdir -p quality
          "$engine" --headless --path game --import 2>&1 | tee quality/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' quality/import.log
          "$engine" --headless --path game -- --devtest="$PWD/quality/starter" --starter-smoke 2>&1 | tee quality/starter-run.log
          ! grep -E 'FAIL:|SCRIPT ERROR|Parse Error' quality/starter-run.log
          xvfb-run -a -s '-screen 0 1280x720x24' "$engine" --path game --resolution 1280x720 -- --devtest="$PWD/quality" --v111 2>&1 | tee quality/runtime.log
          ! grep -E 'FAIL:|SCRIPT ERROR|Parse Error' quality/runtime.log
          test -s quality/quality_printed_labels.png
          test -s quality/quality_first_person_seated.png
          test -s quality/quality_everything_garage.png
          "$engine" --headless --path game -- --devtest="$PWD/quality/legacy" --v18 2>&1 | tee quality/legacy.log
          ! grep -E 'FAIL:|SCRIPT ERROR|Parse Error' quality/legacy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: quality/
  apk:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Read version
        id: ver
        run: echo "version=$(grep -oP '^config/version="\K[^"]+' game/project.godot)" >> "$GITHUB_OUTPUT"
      - name: Build and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o godot.zip
          curl -fLsS --retry 3 "$base/Godot_v4.6.3-stable_export_templates.tpz" -o templates.zip
          unzip -qo godot.zip
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable ~/.config/godot dist
          unzip -jo templates.zip 'templates/android_release.apk' 'templates/android_debug.apk' -d ~/.local/share/godot/export_templates/4.6.3.stable
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.6.tres
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path game --import || true
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path game --export-release Android "$PWD/dist/unsigned.apk"
          test -s dist/unsigned.apk
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            pass="$KEYSTORE_PASS"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass androidrel -alias release -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=No Mans Drive'
            pass=androidrel
          fi
          "$signer" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass "pass:$pass" --out "dist/no-mans-drive-${{ steps.ver.outputs.version }}.apk" dist/unsigned.apk
          "$signer" verify --verbose "dist/no-mans-drive-${{ steps.ver.outputs.version }}.apk"
          rm -f dist/unsigned.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
          else
            gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --title "No Man's Drive $tag" --notes-file RELEASE_NOTES.md
          fi
